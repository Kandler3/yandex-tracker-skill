name: Publish ClawHub 1.1.0

# One-time release workflow; remove it after a successful publication.
on:
  push:
    branches:
      - chore/publish-clawhub-1.1.0
    paths:
      - .github/workflows/clawhub-release-1.1.0.yml

permissions:
  contents: read

concurrency:
  group: clawhub-release-1.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_CHANGELOG: Split detailed guidance into focused references, restore prerequisites and setup documentation, add a skill card, and license the repository under MIT.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ClawHub CLI
        run: npm install --global clawhub@0.23.3

      - name: Configure ClawHub credentials
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [[ -z "$CLAWHUB_TOKEN" ]]; then
            echo "::error::Repository secret CLAWHUB_TOKEN is not configured."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path(os.environ["RUNNER_TEMP"]) / "clawhub-config.json"
          config_path.write_text(
              json.dumps(
                  {
                      "registry": "https://clawhub.ai",
                      "token": os.environ["CLAWHUB_TOKEN"],
                  }
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"

      - name: Preview release
        run: |
          clawhub skill publish . \
            --slug yandex-tracker \
            --name "Yandex Tracker" \
            --owner kandler3 \
            --version 1.1.0 \
            --changelog "$RELEASE_CHANGELOG" \
            --tags latest \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_SHA" \
            --source-path . \
            --dry-run \
            --json

      - name: Publish release
        run: |
          clawhub skill publish . \
            --slug yandex-tracker \
            --name "Yandex Tracker" \
            --owner kandler3 \
            --version 1.1.0 \
            --changelog "$RELEASE_CHANGELOG" \
            --tags latest \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_SHA" \
            --source-path . \
            --json
