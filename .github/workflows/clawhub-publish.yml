name: ClawHub Publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      changelog:
        description: Changelog for this ClawHub release
        required: true
        type: string

jobs:
  preview:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@2d029cf8c5b83f4d539365f1015d8b0e5b481a81
    with:
      skill_path: .
      owner: kandler3
      dry_run: true

  publish:
    if: github.event_name == 'workflow_dispatch'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@2d029cf8c5b83f4d539365f1015d8b0e5b481a81
    with:
      skill_path: .
      owner: kandler3
      dry_run: false
      changelog: ${{ inputs.changelog }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
